
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mini Challenges</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Mini Challenges</h1>
    <h2>1. Flexbox Cards</h2>

    <div class="flex-container">
        <div class="card">
            <h3>HTML</h3>
            <p>HTML helps us create the structure of a website.</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>CSS makes websites attractive and responsive.</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>JavaScript adds interactivity to websites.</p>
        </div>
    </div>
   

    <h2>2. CSS Grid Gallery</h2>

    <div class="grid-container">
        <div class="grid-item">HTML</div>
        <div class="grid-item">CSS</div>
        <div class="grid-item">JavaScript</div>
        <div class="grid-item">React</div>
        <div class="grid-item">Node.js</div>
        <div class="grid-item">MongoDB</div>
    </div>

    <h2>3. Button Animation</h2>

    <button class="animated-button">Hover Me</button>

</body>
</html>
